<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ربط الحساب — AIZARO KING</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:        #0d1117;
      --navy2:       #111827;
      --glass:       rgba(255,255,255,0.05);
      --glass-b:     rgba(255,255,255,0.09);
      --border:      rgba(255,255,255,0.10);
      --glow:        #2563eb;
      --glow-soft:   rgba(37,99,235,0.35);
      --glow-dim:    rgba(37,99,235,0.12);
      --text:        #f1f5f9;
      --text2:       #94a3b8;
      --text3:       #475569;
      --accent:      #3b82f6;
      --accent2:     #60a5fa;
      --red:         #f87171;
      --green:       #34d399;
      --radius:      16px;
    }

    html, body {
      height: 100%;
      font-family: 'Tajawal', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 20px 24px;
      background: radial-gradient(ellipse 80% 60% at 50% 20%, #1a2d5a 0%, #0d1117 55%, #000810 100%);
      position: relative;
      overflow: hidden;
    }

    /* ambient glow blobs */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle 500px at 50% 15%, rgba(37,99,235,0.22) 0%, transparent 70%),
        radial-gradient(circle 300px at 20% 80%, rgba(99,57,200,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Brand ── */
    .brand {
      text-align: center;
      margin-bottom: 4px;
      position: relative;
      z-index: 1;
    }
    .brand-logo-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: -10px;
    }
    .brand-logo-wrap::after {
      content: '';
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34,197,94,0.18) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(18px);
      z-index: 0;
    }
    .brand-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      position: relative;
      z-index: 1;
      filter:
        drop-shadow(0 0 22px rgba(34,197,94,0.35))
        drop-shadow(0 8px 24px rgba(0,0,0,0.7));
    }
    .brand-sub {
      font-family: 'Tajawal', sans-serif;
      font-size: 12px;
      font-weight: 300;
      color: var(--text3);
      letter-spacing: 0.3px;
      margin-top: 0;
    }

    /* ── Main Card — glass like the image ── */
    .card {
      width: 100%;
      max-width: 340px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px 18px 18px;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 8px 40px rgba(0,0,0,0.5),
        0 0 60px rgba(37,99,235,0.08);
      position: relative;
      z-index: 1;
    }

    /* section label — like "UPCOMING" in the image */
    .section-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 14px;
      text-align: right;
    }

    /* ── Field group — left accent line like events list ── */
    .field-group {
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: 50px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      position: relative;
      transition: background 0.2s, border-color 0.2s;
    }
    .field:first-child { border-radius: 12px 12px 0 0; border-bottom: none; }
    .field:last-child  { border-radius: 0 0 12px 12px; }
    .field:only-child  { border-radius: 12px; }
    .field:focus-within {
      background: rgba(59,130,246,0.07);
      border-color: rgba(59,130,246,0.35);
    }

    /* left accent bar — inspired by the colored event lines in the image */
    .field::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.08);
      transition: background 0.25s;
    }
    .field:focus-within::before { background: var(--accent2); }
    .field input.valid ~ .field-line,
    .field:has(input.valid)::before { background: var(--green); }

    .field-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-right: 2px;
      opacity: 0.38;
      transition: opacity 0.2s;
      color: #fff;
    }
    .field:focus-within .field-icon { opacity: 0.75; }
    .field-icon svg { width: 100%; height: 100%; display: block; }
    .field input[type="text"],
    .field input[type="password"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Tajawal', 'Inter', -apple-system, sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.1px;
      direction: rtl;
      text-align: right;
      caret-color: var(--accent2);
    }
    .field input::placeholder { color: var(--text3); font-size: 14px; font-weight: 300; }

    .valid-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      opacity: 0;
      transition: opacity 0.25s;
      flex-shrink: 0;
      box-shadow: 0 0 6px var(--green);
    }
    .field:has(input.valid) .valid-dot { opacity: 1; }

    /* ── Remember row ── */
    .row-remember {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px 14px;
    }
    .row-remember span {
      font-family: 'Tajawal', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: var(--text2);
    }
    .toggle-wrap { position: relative; width: 42px; height: 24px; }
    .toggle-wrap input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s;
    }
    .toggle-wrap input:checked + .toggle-track {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(59,130,246,0.4);
    }
    .toggle-thumb {
      position: absolute;
      top: 3px; right: 3px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
      pointer-events: none;
    }
    .toggle-wrap input:checked ~ .toggle-thumb { transform: translateX(-17px); }

    /* ── Login button ── */
    .btn-login {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
      color: #fff;
      font-family: 'Tajawal', 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(37,99,235,0.4), 0 0 0 1px rgba(255,255,255,0.06);
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      letter-spacing: 0.3px;
    }
    .btn-login:active { transform: scale(0.97); opacity: 0.85; }
    .btn-login:disabled {
      background: rgba(255,255,255,0.06);
      color: var(--text3);
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-login .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-label { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error msg ── */
    #loginErrMsg {
      min-height: 16px;
      font-size: 12px;
      color: var(--red);
      text-align: center;
      margin-top: 10px;
      padding: 0 4px;
    }

    /* ── Footer ── */
    .footer-link {
      margin-top: 18px;
      font-family: 'Tajawal', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: var(--text3);
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .footer-link a {
      color: var(--accent2);
      text-decoration: none;
      cursor: pointer;
    }

    /* ── Register Sheet ── */
    #registerOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(8px);
    }
    #registerOverlay.show { display: flex; }

    .reg-sheet {
      width: 100%;
      max-width: 480px;
      background: rgba(15,23,42,0.92);
      border: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      padding: 16px 18px 36px;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
      animation: slideUp 0.3s cubic-bezier(.32,1.04,.64,1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .sheet-handle {
      width: 32px; height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    .reg-sheet h3 {
      font-family: 'Tajawal', sans-serif;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      color: var(--text);
      margin-bottom: 16px;
      letter-spacing: 0.2px;
    }

    .reg-field-group {
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .reg-field-group .field { /* inherits .field styles above */ }

    .regMsg {
      font-size: 12px;
      text-align: center;
      min-height: 16px;
      margin-bottom: 10px;
      color: var(--red);
    }
    .regMsg.ok { color: var(--green); }

    .btn-reg {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
      color: #fff;
      font-family: 'Tajawal', 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      margin-bottom: 8px;
      box-shadow: 0 4px 16px rgba(37,99,235,0.35);
      transition: opacity 0.2s;
    }
    .btn-reg:active { opacity: 0.8; }
    .btn-reg.secondary {
      background: rgba(255,255,255,0.06);
      color: var(--text2);
      box-shadow: none;
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>

            <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="14" r="4"/><path d="M12 10l8-4"/><path d="M18 8l2 2"/><path d="M20 6l2 2"/></svg></span>
            <input type="text" id="regKeyInput" placeholder="مفتاح التفعيل AIZ-ACC-XXXX">
            <span class="valid-dot"></span>
          </label>
        </div>
        <button class="btn-reg" id="regKeyBtn">تحقق من المفتاح</button>
      </div>

      <div id="regStepForm" style="display:none;">
        <div class="reg-field-group field-group">
          <label class="field">
            <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
            <input type="text" id="regUsername" placeholder="اسم المستخدم">
            <span class="valid-dot"></span>
          </label>
          <label class="field">
            <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1.2" fill="currentColor" stroke="none"/></svg></span>
            <input type="password" id="regPassword" placeholder="كلمة المرور">
            <span class="valid-dot"></span>
          </label>
        </div>
        <button class="btn-reg" id="regSubmitBtn">إنشاء الحساب</button>
      </div>

      <button class="btn-reg secondary" id="closeRegBtn">إلغاء</button>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAgZ9Ma1iK1Q9gaTBsXFQRFAEd427i72GY",
      authDomain: "azi-or-king.firebaseapp.com",
      projectId: "azi-or-king",
      storageBucket: "azi-or-king.firebasestorage.app",
      messagingSenderId: "510389718529",
      appId: "1:510389718529:web:f3dfd2e1e22c0a4ac67a00",
      measurementId: "G-2L98HEYY9X"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function setCurrentUser(u) {
      if (u) localStorage.setItem('aizaro_user', JSON.stringify(u));
      else localStorage.removeItem('aizaro_user');
    }
    function getRegularUserRaw() {
      try { return JSON.parse(localStorage.getItem('aizaro_regular_user') || 'null'); }
      catch(e) { return null; }
    }

    const returnTo = new URLSearchParams(location.search).get('return') || './';

    const nameEl   = document.getElementById('name');
    const emailEl  = document.getElementById('email');
    const loginBtn = document.getElementById('loginBtn');
    const errMsg   = document.getElementById('loginErrMsg');

    function validateInputs() {
      nameEl.classList.toggle('valid', nameEl.value.trim().length > 3);
      emailEl.classList.toggle('valid', emailEl.value.length >= 4);
    }
    nameEl.addEventListener('input', validateInputs);
    emailEl.addEventListener('input', validateInputs);

    loginBtn.addEventListener('click', async () => {
      const username = nameEl.value.trim();
      const password = emailEl.value;
      if (!username || !password) { errMsg.textContent = 'عبّى الخانتين.'; return; }
      errMsg.textContent = '';
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;
      const ok = await attemptLogin(username, password);
      loginBtn.classList.remove('loading');
      loginBtn.disabled = false;
      if (ok) {
        loginBtn.style.background = 'linear-gradient(135deg,#059669,#34d399)';
        loginBtn.style.boxShadow = '0 4px 20px rgba(52,211,153,0.4)';
        setTimeout(() => location.href = returnTo, 500);
      }
    });

    [nameEl, emailEl].forEach(el => el.addEventListener('keydown', e => {
      if (e.key === 'Enter') loginBtn.click();
    }));

    async function attemptLogin(username, password) {
      errMsg.textContent = '';
      try {
        const snap = await db.collection('users').where('username', '==', username).limit(1).get();
        if (snap.empty) { errMsg.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة.'; return false; }
        const doc = snap.docs[0];
        const data = doc.data();
        if (data.password !== password) { errMsg.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة.'; return false; }
        if (data.banned) { errMsg.textContent = 'هاد الحساب محظور.'; return false; }
        setCurrentUser({ id: doc.id, username: data.username, loginAt: Date.now(), subscribed: !!data.subscribed });
        db.collection('users').doc(doc.id).update({ lastSeenAt: Date.now() }).catch(() => {});
        return true;
      } catch(e) { errMsg.textContent = 'صار خطأ، حاول مرة أخرى.'; return false; }
    }

    document.getElementById('openRegisterLink').addEventListener('click', () => {
      document.getElementById('registerOverlay').classList.add('show');
    });
    document.getElementById('closeRegBtn').addEventListener('click', () => {
      document.getElementById('registerOverlay').classList.remove('show');
      document.getElementById('regMsg').textContent = '';
      document.getElementById('regMsg').className = 'regMsg';
    });
    document.getElementById('registerOverlay').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('show');
    });

    let verifiedKey = null;

    document.getElementById('regKeyBtn').addEventListener('click', async () => {
      const key = document.getElementById('regKeyInput').value.trim().toUpperCase();
      const msg = document.getElementById('regMsg');
      if (!key) return;
      msg.textContent = 'جاري التحقق...';
      msg.className = 'regMsg';
      try {
        const snap = await db.collection('accountKeys').doc(key).get();
        if (!snap.exists)    { msg.textContent = 'المفتاح غير صحيح.'; return; }
        if (snap.data().used){ msg.textContent = 'هاد المفتاح مستخدم من قبل.'; return; }
        verifiedKey = key;
        msg.textContent = 'المفتاح صحيح ✓';
        msg.className = 'regMsg ok';
        document.getElementById('regStepKey').style.display  = 'none';
        document.getElementById('regStepForm').style.display = 'block';
      } catch(e) { msg.textContent = 'صار خطأ، حاول مرة أخرى.'; }
    });

    document.getElementById('regSubmitBtn').addEventListener('click', async () => {
      const uname = document.getElementById('regUsername').value.trim();
      const pass  = document.getElementById('regPassword').value;
      const msg   = document.getElementById('regMsg');
      if (!uname || !pass) { msg.textContent = 'عبّى الخانتين.'; return; }
      msg.textContent = 'جاري الإنشاء...';
      msg.className = 'regMsg';
      try {
        const r = getRegularUserRaw();
        const existing = await db.collection('users').where('username', '==', uname).limit(1).get();
        const takenByOther = !existing.empty && !(r && existing.docs[0].id === r.id);
        if (takenByOther) { msg.textContent = 'اسم المستخدم مستعمل، جرب اسم آخر.'; return; }
        let userId;
        if (r) {
          userId = r.id;
          await db.collection('users').doc(userId).update({
            username: uname, password: pass, subscribed: true,
            gems: firebase.firestore.FieldValue.increment(1000)
          });
        } else {
          userId = 'AIZ-U-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase();
          await db.collection('users').doc(userId).set({
            username: uname, password: pass, subscribed: true,
            points: 0, gems: 1000, banned: false,
            createdAt: Date.now(), lastDailyClaim: null, kickedAt: null
          });
        }
        await db.collection('accountKeys').doc(verifiedKey).update({ used: true, usedBy: userId, usedAt: Date.now() });
        setCurrentUser({ id: userId, username: uname, loginAt: Date.now(), subscribed: true });
        if (r) localStorage.removeItem('aizaro_regular_user');
        location.href = returnTo;
      } catch(e) { msg.textContent = 'صار خطأ: ' + e.message; }
    });
  </script>
</body>
</html>
