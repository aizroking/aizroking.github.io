<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIZARO KING — مولّد الأكواد</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --bg:#0a0b0f; --bg-elevated:#16181f; --bg-card:#141620;
  --border:#2a2d38; --border-soft:#1d2029;
  --gold:#f5d980; --gold-soft:#caa53d; --royal:#3b9dff;
  --text:#f2f1ec; --text-muted:#9a9ca6; --radius:20px;
  --danger:#ff3b30; --ok:#22c55e;
  --shadow-lg:0 14px 46px rgba(0,0,0,.6);
}
*{ box-sizing:border-box; }
html{ background:var(--bg); }
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:'IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,sans-serif;
  direction:rtl; -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(245,217,128,.10), transparent 60%),
    radial-gradient(900px 600px at 110% 10%, rgba(59,157,255,.10), transparent 55%),
    var(--bg);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.mono{ font-family:'JetBrains Mono',monospace; }
.wrap{ width:100%; max-width:460px; }
.brand{ text-align:center; margin-bottom:22px; }
.brand .mark{ font-size:13px; letter-spacing:.12em; color:var(--gold); font-weight:700; text-transform:uppercase; }
.brand h1{ margin:6px 0 0; font-size:22px; font-weight:700; }
.card{
  background:linear-gradient(180deg, var(--bg-card), #101219);
  border:1px solid var(--border); border-radius:var(--radius);
  padding:26px; box-shadow:var(--shadow-lg); position:relative; overflow:hidden;
}
.card::before{
  content:''; position:absolute; inset:-2px; border-radius:inherit; padding:1px;
  background:linear-gradient(120deg, rgba(245,217,128,.35), transparent 30%, transparent 70%, rgba(59,157,255,.25));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
}
.card h2{ margin:0 0 6px; font-size:18px; }
.card p.hint{ margin:0 0 18px; color:var(--text-muted); font-size:13px; line-height:1.7; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:6px; }
input[type=text]{
  width:100%; padding:14px 16px; border-radius:14px; border:1px solid var(--border);
  background:#0d0e13; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:15px;
  text-align:center; letter-spacing:.04em; transition:border-color .15s ease;
}
input[type=text]:focus{ outline:none; border-color:var(--gold-soft); }
.btn{
  width:100%; border:none; border-radius:980px; padding:14px 18px; font-size:15px; font-weight:700;
  font-family:'IBM Plex Sans Arabic',sans-serif; cursor:pointer; transition:transform .12s ease, opacity .12s ease;
}
.btn:active{ transform:scale(.97); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn-gold{ background:linear-gradient(90deg,var(--gold-soft),var(--gold)); color:#1a1305; }
.btn-ghost{ background:transparent; border:1px solid var(--border); color:var(--text-muted); }
.msg{ border-radius:12px; padding:11px 14px; font-size:13.5px; margin-bottom:14px; line-height:1.6; }
.msg.err{ background:#ff3b3018; color:#ff6b60; border:1px solid #ff3b3040; }
.msg.ok{ background:#22c55e18; color:#4ade80; border:1px solid #22c55e40; }

/* generator screen */
.status-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--border-soft); }
.status-row .k{ font-size:12px; color:var(--text-muted); }
.status-row .v{ font-size:14px; font-weight:700; color:var(--gold); }
.quota-bar-track{ height:8px; border-radius:99px; background:#0d0e13; border:1px solid var(--border); overflow:hidden; margin-top:8px; }
.quota-bar-fill{ height:100%; background:linear-gradient(90deg,var(--royal),var(--gold)); transition:width .25s ease; }
.points-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0; }
.pt-btn{
  border:1px solid var(--border); background:#0d0e13; border-radius:16px; padding:16px 8px;
  text-align:center; cursor:pointer; transition:transform .12s ease, border-color .12s ease, background .12s ease;
}
.pt-btn:active{ transform:scale(.95); }
.pt-btn .n{ font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--text); }
.pt-btn .l{ font-size:11px; color:var(--text-muted); margin-top:2px; }
.pt-btn:not(.disabled):hover{ border-color:var(--gold-soft); }
.pt-btn.disabled{ opacity:.35; cursor:not-allowed; }
.result-card{
  display:none; background:#0d0e13; border:1px dashed var(--gold-soft); border-radius:16px;
  padding:18px; text-align:center; margin-bottom:16px; position:relative; overflow:visible;
}
.result-card.show{ display:block; }
.result-card .code{ font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:var(--gold); letter-spacing:.06em; word-break:break-all; }
.result-card .pts{ font-size:13px; color:var(--text-muted); margin-top:4px; }

/* ---- celebration animation on successful generation ---- */
.result-card.celebrate{
  animation: cardPop .5s cubic-bezier(.2,1.4,.4,1) both, glowPulse 1.1s ease-out .05s;
  border-style:solid; border-color:var(--gold);
}
@keyframes cardPop{
  0%{ transform:scale(.88); }
  55%{ transform:scale(1.035); }
  100%{ transform:scale(1); }
}
@keyframes glowPulse{
  0%{ box-shadow:0 0 0 0 rgba(245,217,128,.55); }
  100%{ box-shadow:0 0 0 26px rgba(245,217,128,0); }
}
.result-card.celebrate .code{
  animation: codeReveal .5s ease .1s both;
}
@keyframes codeReveal{
  0%{ opacity:0; letter-spacing:.3em; filter:blur(3px); }
  100%{ opacity:1; letter-spacing:.06em; filter:blur(0); }
}
.spark-layer{
  position:absolute; inset:0; pointer-events:none; overflow:visible;
  display:flex; align-items:center; justify-content:center;
}
.spark{
  position:absolute; top:50%; left:50%; width:7px; height:7px; border-radius:50%;
  background:var(--gold); opacity:0;
  animation: sparkFly .75s ease-out forwards;
}
.spark.blue{ background:var(--royal); }
.spark.diamond{ border-radius:2px; transform:rotate(45deg); }
@keyframes sparkFly{
  0%{ opacity:1; transform:translate(-50%,-50%) translate(0,0) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(.3); }
}

.copy-row{ display:flex; gap:8px; margin-top:12px; }
.copy-row .btn{ flex:1; padding:11px; font-size:13.5px; }
.history{ margin-top:16px; }
.history h4{ font-size:12px; color:var(--text-muted); margin:0 0 8px; font-weight:600; }
.history ul{ list-style:none; margin:0; padding:0; max-height:160px; overflow-y:auto; }
.history li{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:12.5px; padding:8px 10px; border-radius:10px; background:#0d0e13; margin-bottom:6px; }
.history li span:last-child{ color:var(--gold); }
.foot-link{ text-align:center; margin-top:14px; }
.foot-link a{ color:var(--text-muted); font-size:12.5px; text-decoration:none; cursor:pointer; }
.foot-link a:hover{ color:var(--gold); }
.spinner{ display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:#1a1305; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-left:6px; }
@keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <div class="mark">AIZARO KING</div>
    <h1>🔥 مولّد أكواد النقاط</h1>
  </div>

  <!-- Activation screen -->
  <div class="card" id="activateCard">
    <h2>تفعيل بمفتاح</h2>
    <p class="hint">دخل المفتاح اللي عطاوهولك باش تفتح مولّد الأكواد. كل مفتاح عندو مدة صلاحية محددة من الإدارة.</p>
    <div id="activateMsg"></div>
    <div class="field">
      <label>المفتاح</label>
      <input type="text" id="keyInput" class="mono" placeholder="AIZ-GEN-XXXXXX" autocomplete="off">
    </div>

  </div>

  <!-- Generator screen -->
  <div class="card" id="genCard" style="display:none;">
    <div class="status-row">
      <div>
        <div class="k">المفتاح صالح لـ</div>
        <div class="v" id="daysLeftLabel">—</div>
      </div>
      <div style="text-align:left;">
        <div class="k">الأكواد (استُعمل/الحد)</div>
        <div class="v" id="genCountLabel">0 / 0</div>
      </div>
    </div>

    <div class="status-row" style="border-bottom:none; margin-bottom:8px; padding-bottom:0;">
      <div>
        <div class="k">المستعمل اليوم (نقاط)</div>
      </div>
      <div style="text-align:left;">
        <div class="v" id="quotaLabel">0 / 2000</div>
      </div>
    </div>
    <div class="quota-bar-track"><div class="quota-bar-fill" id="quotaBar" style="width:0%;"></div></div>

    <div id="genMsg" style="margin-top:16px;"></div>

    <div class="points-grid" id="pointsGrid">
      <div class="pt-btn" data-points="100"><div class="n">100</div><div class="l">نقطة</div></div>
      <div class="pt-btn" data-points="500"><div class="n">500</div><div class="l">نقطة</div></div>
      <div class="pt-btn" data-points="1000"><div class="n">1000</div><div class="l">نقطة</div></div>
    </div>

    <div class="field" style="margin-top:4px;">
      <label>ولا حط مبلغ مخصص (الأقصى: <span id="maxPerCodeLabel">1000</span>)</label>
      <div style="display:flex; gap:8px;">
        <input type="text" inputmode="numeric" id="customAmount" class="mono" placeholder="مثلاً: 250" style="flex:1;">
        <button class="btn btn-gold" id="customGenBtn" style="width:auto; padding:12px 20px;">توليد</button>
      </div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="spark-layer" id="sparkLayer"></div>
      <div class="pts" id="resultPts"></div>
      <div class="code mono" id="resultCode"></div>
      <div class="copy-row">
        <button class="btn btn-gold" id="copyBtn">📋 نسخ الكود</button>
      </div>
    </div>

    <div class="history" id="historyBox" style="display:none;">
      <h4>أكواد ولّيتهم اليوم</h4>
      <ul id="historyList"></ul>
    </div>

    <div class="foot-link"><a id="switchKeyBtn">تبديل المفتاح</a></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAgZ9Ma1iK1Q9gaTBsXFQRFAEd427i72GY",
  authDomain: "azi-or-king.firebaseapp.com",
  projectId: "azi-or-king",
  storageBucket: "azi-or-king.firebasestorage.app",
  messagingSenderId: "510389718529",
  appId: "1:510389718529:web:f3dfd2e1e22c0a4ac67a00",
  measurementId: "G-2L98HEYY9X"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let DAILY_CAP = 2000; // fallback default, overwritten by admin-controlled settings/generatorConfig
async function loadDailyCap(){
  try{
    const snap = await db.collection('settings').doc('generatorConfig').get();
    if (snap.exists && Number(snap.data().dailyCap) > 0){
      DAILY_CAP = Number(snap.data().dailyCap);
    }
  } catch(e){}
}
const SESSION_KEY = 'aizaro_gen_key';
const HISTORY_KEY = 'aizaro_gen_history';

function escapeHTML(str){ const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
function todayStr(){ return new Date().toISOString().slice(0, 10); }

/* ---- Pleasant synthesized sounds (no external files needed) ---- */
let audioCtx = null;
function getAudioCtx(){
  if (!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function playTone(freq, startTime, duration, gainPeak, type){
  const ctx = getAudioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}
function playSuccessChime(){
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t = ctx.currentTime;
  // bright ascending coin-like arpeggio
  playTone(783.99, t, 0.16, 0.16, 'triangle');       // G5
  playTone(987.77, t + 0.09, 0.16, 0.15, 'triangle'); // B5
  playTone(1318.51, t + 0.18, 0.28, 0.14, 'triangle');// E6
}
function playActivateChime(){
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t = ctx.currentTime;
  playTone(523.25, t, 0.18, 0.14, 'sine');   // C5
  playTone(659.25, t + 0.1, 0.22, 0.13, 'sine'); // E5
}
function playErrorTone(){
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t = ctx.currentTime;
  playTone(220, t, 0.22, 0.12, 'sawtooth');
}

function celebrateSuccess(){
  const card = document.getElementById('resultCard');
  const layer = document.getElementById('sparkLayer');
  layer.innerHTML = '';
  card.classList.remove('celebrate');
  void card.offsetWidth; // restart animation if triggered again
  card.classList.add('celebrate');

  const count = 18;
  for (let i = 0; i < count; i++){
    const el = document.createElement('div');
    const isDiamond = i % 4 === 0;
    const isBlue = i % 3 === 0;
    el.className = 'spark' + (isBlue ? ' blue' : '') + (isDiamond ? ' diamond' : '');
    const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.4 - 0.2);
    const dist = 70 + Math.random() * 55;
    el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    el.style.animationDelay = (Math.random() * 0.08) + 's';
    layer.appendChild(el);
  }
  setTimeout(() => { layer.innerHTML = ''; }, 900);
}



function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 9; i++){ if (i === 4) s += '-'; s += chars[Math.floor(Math.random() * chars.length)]; }
  return 'AIZ-' + s;
}

let currentClientIP = null;
async function getPublicIP(){
  if (currentClientIP) return currentClientIP;
  try{
    const res = await fetch('https://api.ipify.org?format=json');
    const data = await res.json();
    if (data.ip){ currentClientIP = data.ip; return data.ip; }
  } catch(e){}
  try{
    const res2 = await fetch('https://api64.ipify.org?format=json');
    const data2 = await res2.json();
    if (data2.ip){ currentClientIP = data2.ip; return data2.ip; }
  } catch(e){}
  return null;
}

function getSavedActivation(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e){ return null; }
}
function saveActivation(rec){ localStorage.setItem(SESSION_KEY, JSON.stringify(rec)); }
function clearActivation(){ localStorage.removeItem(SESSION_KEY); }

function getTodayHistory(){
  try{
    const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    return h[todayStr()] || [];
  } catch(e){ return []; }
}
function addTodayHistory(code, points){
  let h = {};
  try{ h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}'); } catch(e){}
  const t = todayStr();
  h[t] = h[t] || [];
  h[t].push({ code, points, at: Date.now() });
  // keep only today's key to avoid unbounded growth
  localStorage.setItem(HISTORY_KEY, JSON.stringify({ [t]: h[t] }));
}

function renderHistory(){
  const list = getTodayHistory();
  const box = document.getElementById('historyBox');
  const ul = document.getElementById('historyList');
  if (list.length === 0){ box.style.display = 'none'; return; }
  box.style.display = 'block';
  ul.innerHTML = list.slice().reverse().map(item =>
    `<li><span>${escapeHTML(item.code)}</span><span>${item.points} نقطة</span></li>`
  ).join('');
}

/* ---- Key activation ---- */
async function verifyKey(rawKey){
  const key = rawKey.trim().toUpperCase();
  if (!key) return { ok:false, reason:'empty' };
  const snap = await db.collection('genKeys').doc(key).get();
  if (!snap.exists) return { ok:false, reason:'notfound' };
  const data = snap.data();
  if (data.revoked) return { ok:false, reason:'revoked' };
  if (data.expiresAt && Date.now() > data.expiresAt) return { ok:false, reason:'expired' };
  const generationLimit = Number(data.generationLimit) || 0;
  const generatedCount = Number(data.generatedCount) || 0;
  if (generationLimit && generatedCount >= generationLimit) return { ok:false, reason:'limitreached' };
  return {
    ok:true, key, expiresAt: data.expiresAt, days: data.days,
    maxPerCode: Math.min(1000, Number(data.maxPerCode) || 1000),
    maxUses: Number(data.maxUses) || 1,
    codeExpiryDays: data.codeExpiryDays || null,
    generationLimit, generatedCount
  };
}

document.getElementById('activateBtn').addEventListener('click', async () => {
  const btn = document.getElementById('activateBtn');
  const msg = document.getElementById('activateMsg');
  const input = document.getElementById('keyInput');
  msg.innerHTML = '';
  const raw = input.value.trim();
  if (!raw){ msg.innerHTML = '<div class="msg err">دخل المفتاح.</div>'; return; }
  btn.disabled = true; btn.innerHTML = 'جاري التحقق...<span class="spinner"></span>';
  try{
    const result = await verifyKey(raw);
    if (!result.ok){
      const map = {
        notfound: 'هاذ المفتاح مش موجود.',
        revoked: 'تم إلغاء هاذ المفتاح من طرف الإدارة.',
        expired: 'انتهت صلاحية هاذ المفتاح.',
        limitreached: 'هاذ المفتاح وصل للحد الأقصى لعدد الأكواد اللي يقدر يولّدهم.',
        empty: 'دخل المفتاح.'
      };
      msg.innerHTML = `<div class="msg err">${map[result.reason] || 'مفتاح غير صالح.'}</div>`;
      playErrorTone();
      btn.disabled = false; btn.textContent = 'تفعيل';
      return;
    }
    const ip = await getPublicIP();
    // record first activation info (best-effort, doesn't restrict device)
    db.collection('genKeys').doc(result.key).update({
      lastActivatedAt: Date.now(),
      lastActivatedIP: ip || null
    }).catch(()=>{});
    saveActivation({
      key: result.key, expiresAt: result.expiresAt, days: result.days,
      maxPerCode: result.maxPerCode, maxUses: result.maxUses,
      codeExpiryDays: result.codeExpiryDays, generationLimit: result.generationLimit
    });
    playActivateChime();
    showGenerator();
  } catch(e){
    msg.innerHTML = '<div class="msg err">صار خطأ، جرب مرة أخرى.</div>';
    btn.disabled = false; btn.textContent = 'تفعيل';
  }
});
document.getElementById('keyInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('activateBtn').click();
});
document.getElementById('switchKeyBtn').addEventListener('click', () => {
  clearActivation();
  document.getElementById('genCard').style.display = 'none';
  document.getElementById('activateCard').style.display = 'block';
  document.getElementById('keyInput').value = '';
  document.getElementById('activateBtn').disabled = false;
  document.getElementById('activateBtn').textContent = 'تفعيل';
});

/* ---- Generator screen ---- */
async function getRemainingQuota(){
  const ip = await getPublicIP();
  if (!ip) return { ip:null, used:0, remaining:DAILY_CAP };
  const docId = ip + '_' + todayStr();
  try{
    const snap = await db.collection('genQuota').doc(docId).get();
    const used = snap.exists ? (Number(snap.data().totalPoints) || 0) : 0;
    return { ip, used, remaining: Math.max(0, DAILY_CAP - used) };
  } catch(e){
    return { ip, used:0, remaining:DAILY_CAP };
  }
}

function updateQuotaUI(used, remaining, activation){
  document.getElementById('quotaLabel').textContent = `${used} / ${DAILY_CAP}`;
  document.getElementById('quotaBar').style.width = Math.min(100, (used / DAILY_CAP) * 100) + '%';
  const maxPerCode = activation.maxPerCode || 1000;
  document.querySelectorAll('.pt-btn').forEach(el => {
    const pts = Number(el.dataset.points);
    el.classList.toggle('disabled', pts > remaining || pts > maxPerCode);
  });
}

async function refreshQuota(){
  const activation = getSavedActivation();
  const { used, remaining } = await getRemainingQuota();
  updateQuotaUI(used, remaining, activation || {});
  const genLimit = Number(activation && activation.generationLimit) || 0;
  const keySnap = await db.collection('genKeys').doc(activation.key).get().catch(()=>null);
  const generatedCount = keySnap && keySnap.exists ? (Number(keySnap.data().generatedCount) || 0) : 0;
  document.getElementById('genCountLabel').textContent = `${generatedCount} / ${genLimit}`;
  return remaining;
}

async function generateCode(points){
  const msg = document.getElementById('genMsg');
  msg.innerHTML = '';
  document.querySelectorAll('.pt-btn').forEach(el => el.style.pointerEvents = 'none');
  document.getElementById('customGenBtn').disabled = true;

  const activation = getSavedActivation();
  if (!activation){ location.reload(); return; }
  await loadDailyCap();

  const maxPerCode = activation.maxPerCode || 1000;
  if (!Number.isFinite(points) || points < 1){
    msg.innerHTML = '<div class="msg err">دخل مبلغ صحيح.</div>';
    playErrorTone();
    document.querySelectorAll('.pt-btn').forEach(el => el.style.pointerEvents = 'auto');
    document.getElementById('customGenBtn').disabled = false;
    return;
  }
  if (points > maxPerCode){
    msg.innerHTML = `<div class="msg err">أقصى نقاط للكود الواحد هو ${maxPerCode}.</div>`;
    playErrorTone();
    document.querySelectorAll('.pt-btn').forEach(el => el.style.pointerEvents = 'auto');
    document.getElementById('customGenBtn').disabled = false;
    return;
  }

  // re-verify key hasn't been revoked/expired/limit-reached since activation
  const keyCheck = await verifyKey(activation.key);
  if (!keyCheck.ok){
    const map = {
      revoked: 'المفتاح تم إلغاؤه.',
      expired: 'انتهت صلاحية المفتاح.',
      limitreached: 'وصلت للحد الأقصى لعدد الأكواد بهاذ المفتاح.'
    };
    msg.innerHTML = `<div class="msg err">${map[keyCheck.reason] || 'المفتاح ماعادش صالح.'}</div>`;
    playErrorTone();
    document.querySelectorAll('.pt-btn').forEach(el => el.style.pointerEvents = 'auto');
    document.getElementById('customGenBtn').disabled = false;
    if (keyCheck.reason === 'revoked' || keyCheck.reason === 'expired'){
      setTimeout(() => document.getElementById('switchKeyBtn').click(), 1600);
    }
    return;
  }

  const ip = await getPublicIP();
  if (!ip){
    msg.innerHTML = '<div class="msg err">ما قدرناش نتعرفو على الـ IP تاعك، جرب مرة أخرى.</div>';
    document.querySelectorAll('.pt-btn').forEach(el => el.style.pointerEvents = 'auto');
    document.getElementById('customGenBtn').disabled = false;
    return;
  }

  const quotaRef = db.collection('genQuota').doc(ip + '_' + todayStr());
  const keyRef = db.collection('genKeys').doc(activation.key);
  const code = genCode();
  const codeRef = db.collection('codes').doc(code);
  const codeExpiresAt = activation.codeExpiryDays ? Date.now() + Number(activation.codeExpiryDays) * 86400000 : null;

  try{
    await db.runTransaction(async (tx) => {
      const quotaSnap = await tx.get(quotaRef);
      const keySnap = await tx.get(keyRef);
      if (!keySnap.exists) throw new Error('keygone');
      const keyData = keySnap.data();
      if (keyData.revoked) throw new Error('revoked');
      if (keyData.expiresAt && Date.now() > keyData.expiresAt) throw new Error('expired');
      const genLimit = Number(keyData.generationLimit) || 0;
      const genCount = Number(keyData.generatedCount) || 0;
      if (genLimit && genCount >= genLimit) throw new Error('limitreached');

      const used = quotaSnap.exists ? (Number(quotaSnap.data().totalPoints) || 0) : 0;
      if (used + points > DAILY_CAP) throw new Error('cap');

      tx.set(quotaRef, { ip, date: todayStr(), totalPoints: used + points }, { merge: true });
      tx.update(keyRef, { generatedCount: genCount + 1 });
      tx.set(codeRef, {
        points, used:false, maxUses: activation.maxUses || 1, usesCount:0,
        durationDays:null, expiresAt: codeExpiresAt, createdAt: Date.now(),
        source:'generator', genKey: activation.key
      });
    });

    addTodayHistory(code, points);
    renderHistory();
    document.getElementById('resultPts').textContent = `كود بقيمة ${points} نقطة`;
    document.getElementById('resultCode').textContent = code;
    document.getElementById('resultCard').classList.add('show');
    celebrateSuccess();
    msg.innerHTML = '<div class="msg ok">تم توليد الكود بنجاح ✅</div>';
    playSuccessChime();
    document.getElementById('customAmount').value = '';
    await refreshQuota();
  } catch(e){
    const errMap = {
      cap: `وصلت للحد اليومي (${DAILY_CAP} نقطة). حاول غدا.`,
      limitreached: 'وصلت للحد الأقصى لعدد الأكواد بهاذ المفتاح.',
      revoked: 'المفتاح تم إلغاؤه.',
      expired: 'انتهت صلاحية المفتاح.',
      keygone: 'المفتاح ماعادش موجود.'
    };
    msg.innerHTML = `<div class="msg err">${errMap[e.message] || 'صار خطأ، جرب مرة أخرى.'}</div>`;
    playErrorTone();
    await refreshQuota();
  }
  document.querySelectorAll('.pt-btn').forEach(el => el.style.pointerEvents = 'auto');
  document.getElementById('customGenBtn').disabled = false;
}

document.getElementById('pointsGrid').addEventListener('click', (e) => {
  const btn = e.target.closest('.pt-btn');
  if (!btn || btn.classList.contains('disabled')) return;
  generateCode(Number(btn.dataset.points));
});

document.getElementById('customGenBtn').addEventListener('click', () => {
  const raw = document.getElementById('customAmount').value.trim();
  const val = Math.floor(Number(raw));
  generateCode(val);
});
document.getElementById('customAmount').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('customGenBtn').click();
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const code = document.getElementById('resultCode').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById('copyBtn');
    const original = btn.textContent;
    btn.textContent = '✅ نُسخ';
    setTimeout(() => btn.textContent = original, 1400);
  });
});

function formatDaysLeft(expiresAt){
  if (!expiresAt) return '—';
  const ms = expiresAt - Date.now();
  if (ms <= 0) return 'منتهي';
  const days = Math.floor(ms / 86400000);
  const hours = Math.floor((ms % 86400000) / 3600000);
  if (days > 0) return `${days} يوم و ${hours} سا`;
  return `${hours} سا`;
}

async function showGenerator(){
  document.getElementById('activateCard').style.display = 'none';
  document.getElementById('genCard').style.display = 'block';
  const activation = getSavedActivation();
  document.getElementById('daysLeftLabel').textContent = formatDaysLeft(activation.expiresAt);
  document.getElementById('maxPerCodeLabel').textContent = activation.maxPerCode || 1000;
  renderHistory();
  await refreshQuota();
}

(async function init(){
  await loadDailyCap();
  const activation = getSavedActivation();
  if (activation){
    const keyCheck = await verifyKey(activation.key);
    if (keyCheck.ok){
      saveActivation({
        key: keyCheck.key, expiresAt: keyCheck.expiresAt, days: keyCheck.days,
        maxPerCode: keyCheck.maxPerCode, maxUses: keyCheck.maxUses,
        codeExpiryDays: keyCheck.codeExpiryDays, generationLimit: keyCheck.generationLimit
      });
      showGenerator();
      return;
    }
    clearActivation();
  }
  document.getElementById('activateCard').style.display = 'block';
})();
</script>
